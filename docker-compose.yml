# ---------------------------------------------------------------------------
# Local development stack: `docker compose up --build`
#
#   client  -> http://localhost:8080
#   API     -> http://localhost:5001  (health: /health)
#   MySQL   -> localhost:3307         (3307, not 3306, so it does not clash
#                                      with a MySQL already on the host)
#
# The credentials below are throwaway local-dev values. Nothing here is
# intended for a deployed environment.
# ---------------------------------------------------------------------------

name: ecommerce-fullstack

services:
  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: ecommerce_db
      MYSQL_USER: ecommerce
      MYSQL_PASSWORD: ecommerce_pass
    ports:
      - "3307:3306"
    volumes:
      # Scripts in this directory run once, in name order, on an empty data
      # volume: schema first, then seed.
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./server/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - db_data:/var/lib/mysql
    healthcheck:
      # Forcing TCP (-h 127.0.0.1) matters: during initialisation MySQL only
      # listens on its unix socket, so this stays unhealthy until the schema
      # and seed scripts have finished.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  server:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ecommerce_db
      DB_USER: ecommerce
      DB_PASSWORD: ecommerce_pass
      # The MySQL container's TLS cert is self-signed; config/db.js connects
      # with rejectUnauthorized: false.
      PORT: "5001"
      # The client is served from a different port, so it is a different
      # origin and has to be allowed explicitly.
      CORS_ORIGIN: http://localhost:8080
    ports:
      - "5001:5001"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
      args:
        # Baked into the bundle at build time, so it must be the address the
        # browser uses -- the published port on the host, not "server:5001".
        VITE_API_URL: http://localhost:5001
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  db_data:
